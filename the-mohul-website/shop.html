<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Premium Makeup Products | The Mohul Bankura — Online Store</title>
  <meta name="description" content="Shop authentic, professional-grade makeup products — MAC, Kryolan, Urban Decay, Temptu, NARS and more. Delivered across India.">
  <meta name="theme-color" content="#0F5132">
  <link rel="canonical" href="https://www.themohulmakeup.in/shop.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <div id="header-mount"></div>

  <main class="page">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Online Store</span>
        <h1>Shop Premium Makeup Products</h1>
        <p>The same authentic, professional-grade products we use on our clients — delivered across India.</p>
        <div class="breadcrumb"><a href="index.html">Home</a> <span>/</span> <span>Shop</span></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="shop-toolbar">
          <div class="shop-filters" id="shopFilters">
            <button class="filter-btn active" data-cat="all">All</button>
            <button class="filter-btn" data-cat="Bridal">Bridal</button>
            <button class="filter-btn" data-cat="Face">Face</button>
            <button class="filter-btn" data-cat="Eyes">Eyes</button>
            <button class="filter-btn" data-cat="Lips">Lips</button>
            <button class="filter-btn" data-cat="Tools">Tools</button>
          </div>
          <div class="shop-search">
            <input type="text" id="shopSearch" placeholder="Search products...">
          </div>
        </div>
        <div id="shopProducts" class="grid grid-3 product-grid">
          <div class="shop-loading">Loading products...</div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-mount"></div>
  <div id="overlay-mount"></div>
  <div id="shop-modal-mount"></div>
  <script src="js/script.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
